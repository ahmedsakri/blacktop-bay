<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#110017">
  <meta name="robots" content="noindex,follow">
  <title>Reconnect — Camber Reign</title>
  <link rel="icon" href="/assets/app-icon-192.png" type="image/png">
  <style>
    @font-face{font-family:Manrope;src:url('/assets/manrope.woff2') format('woff2');font-display:swap}
    @font-face{font-family:Barlow;src:url('/assets/barlow-condensed-extrabold-italic.woff2') format('woff2');font-weight:800;font-style:italic;font-display:swap}
    *{box-sizing:border-box}html{background:#110017;color:#fff}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));font:14px/1.65 Manrope,system-ui,sans-serif;background:radial-gradient(ellipse at 90% 0%,#9246ff28,transparent 65%),#110017}
    main{width:min(660px,100%);padding:clamp(20px,5vw,42px);border:1px solid #9246ff88;border-left:4px solid #9246ff;background:linear-gradient(135deg,#021439,#110017);box-shadow:0 18px 80px #0006}.logo{display:block;width:min(320px,100%);height:auto;margin-bottom:24px}.eyebrow{margin:0 0 8px;font-size:11px;letter-spacing:.16em;font-weight:800}h1{margin:0;font:italic 800 clamp(38px,9vw,64px)/.95 Barlow,sans-serif;text-transform:uppercase}h1 span{color:#FFF71E}p{max-width:50ch;margin:20px 0;color:#e2dce8}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}button,a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:10px 18px;border:1px solid #9246ff;font:800 13px/1.4 Manrope,system-ui,sans-serif;cursor:pointer;text-decoration:none;background:#021439;color:#fff}button{background:#FFF71E;border-color:#FFF71E;color:#110017}svg{width:20px;height:20px;flex:none}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}.note{font-size:12px;margin-bottom:0;color:#c8c0d2}
    @media(max-height:420px) and (orientation:landscape){body{padding-block:12px}main{padding:18px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 20px}.logo{grid-column:1;grid-row:1;width:220px;margin:0}.eyebrow{grid-column:1;grid-row:2;margin:0}h1{grid-column:1;grid-row:3;font-size:38px}main>p:not([class]){grid-column:2;grid-row:1/span 3;align-self:center;margin:0;font-size:13px}.actions{grid-column:1/-1;grid-row:4;margin:0}.note{grid-column:1/-1;grid-row:5;max-width:none;margin:0;font-size:11px}}
  </style>
  <script src="/assets/offline.js" defer></script>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo-compact.svg" alt="Camber Reign" width="860" height="150">
    <p class="eyebrow">BACK ON THE GRID</p>
    <h1>Reconnect.<br><span>Then race.</span></h1>
    <p>Camber Reign needs an internet connection to load your car and circuit. Reconnect to Wi-Fi or mobile data, then try again.</p>
    <div class="actions">
      <button id="retry" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-4l-3 3m1 3a7 7 0 0 0 12 4l3-3"/></svg>TRY AGAIN</button>
      <a href="/">RACE HQ<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></a>
    </div>
    <p class="note" id="connection-status" role="status">Home Screen installation does not include offline racing. Your saved progress stays in this browser.</p>
  </main>
</body>
</html>
