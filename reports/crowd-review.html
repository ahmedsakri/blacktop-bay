<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crowd visual review — local fixture</title><style>body{margin:0;background:#110017;color:white;font:14px system-ui}canvas{display:block;width:100%;height:100%}header{position:absolute;top:12px;left:12px;background:#110017dc;padding:12px;border-radius:8px}button{font:inherit;padding:12px;background:#9246ff;color:white;border:1px solid #fff;border-radius:6px}p{margin:7px 0}</style></head><body><header>Local crowd review fixture<p>Actual crowd geometry and motion. Not a completed gameplay test.</p><button id="close">Close / anatomy</button> <button id="road">Road camera distance</button> <button id="pause">Pause</button></header><script type="module">
import * as T from 'three';import {createCrowd} from '/src/crowd.js';
const scene=new T.Scene();scene.background=new T.Color('#27374b');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight('#d7e7ff','#725745',2));const sun=new T.DirectionalLight('#ffebd4',2.3);sun.position.set(-8,15,10);scene.add(sun);
const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,250);camera.position.set(5,3.5,10);camera.lookAt(0,1.1,0);
let seed=124;const rng=()=>((seed=Math.imul(seed,1664525)+1013904223)>>>0)/4294967296;
const crowd=createCrowd({low:innerWidth<800||new URLSearchParams(location.search).has('mobile')});for(let row=0;row<4;row++){for(let seat=-6;seat<=6;seat++){if(seat===0||rng()<.16)continue;const floor=.4+row*.65;crowd.add(seat*.82,floor,-row*1.15,(rng()-.5)*.14,row<3,rng);const chair=new T.Mesh(new T.BoxGeometry(.52,.1,.50),new T.MeshStandardMaterial({color:'#24536c'}));chair.position.set(seat*.82,floor+.4,-row*1.15);scene.add(chair);}const ledge=new T.Mesh(new T.BoxGeometry(12,.3,1.15),new T.MeshStandardMaterial({color:'#87908b'}));ledge.position.set(0,.25+row*.65,-row*1.15);scene.add(ledge);}crowd.render(scene);
let paused=false;document.querySelector('#close').onclick=()=>{camera.position.set(4,2.8,8);camera.lookAt(0,1.5,-1)};document.querySelector('#road').onclick=()=>{camera.position.set(5,2.5,24);camera.lookAt(0,1.6,-1)};document.querySelector('#pause').onclick=()=>{paused=!paused};
const status=document.createElement('p');document.querySelector('header').append(status);const far=document.createElement('button');far.textContent='Far LOD';document.querySelector('header').append(far);let inspectFar=false;far.onclick=()=>{inspectFar=false;camera.position.set(5,5,58);camera.lookAt(0,1.6,-1);};const farDetail=document.createElement('button');farDetail.textContent='Inspect far mesh';document.querySelector('header').append(farDetail);farDetail.onclick=()=>{inspectFar=!inspectFar;camera.position.set(5,3.5,10);camera.lookAt(0,1.6,-1);};const reduce=document.createElement('button');reduce.textContent='Reduced motion';document.querySelector('header').append(reduce);let reducedMotion=false;reduce.onclick=()=>reducedMotion=!reducedMotion;
const clock=new T.Clock();renderer.setAnimationLoop(()=>{crowd.update(clock.getElapsedTime(),{x:camera.position.x,z:inspectFar?58:camera.position.z,speed:20},{paused,reducedMotion});renderer.render(scene,camera);const c=scene.userData.crowd;status.textContent=`${c.activeCharacters} near + ${c.mediumCharacters} textured middle + ${c.farCharacters||0} textured far + ${c.visiblePeople-c.activeCharacters-c.mediumCharacters-(c.farCharacters||0)} fallback · ${renderer.info.render.calls} scene draws · ${renderer.info.render.triangles.toLocaleString()} triangles · ${paused?'paused':reducedMotion?'reduced motion':'animated'}${inspectFar?' · inspecting reduced mesh close up':''}`;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});addEventListener('pagehide',()=>crowd.dispose());
</script></body></html>
