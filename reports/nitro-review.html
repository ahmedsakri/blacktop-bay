<!doctype html><html><meta charset="utf-8"><title>Local Nitro effect review</title><style>body{margin:0;background:#110017;color:white;font:16px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}button{min-height:44px}canvas{display:block}span{font-size:13px}</style><header><button id="normal">Normal driving</button><button id="boost">Blue Nitro</button><button id="ev">EV wake</button><button id="reduced">Reduced motion</button><span id="status">Local rendering fixture, not gameplay.</span></header><script type="module">
import * as THREE from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import{prepareManufacturerCar,createManufacturerCar}from'/src/manufacturer-car.js';import{createEffects}from'/src/effects.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1.5);renderer.setSize(innerWidth,innerHeight-68);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#263344');const camera=new THREE.PerspectiveCamera(48,innerWidth/(innerHeight-68),.1,500);const room=new RoomEnvironment(),pm=new THREE.PMREMGenerator(renderer),env=pm.fromScene(room,.04);scene.environment=env.texture;scene.add(new THREE.HemisphereLight('#cfe6ff','#262833',2));const sun=new THREE.DirectionalLight('#fff',2);sun.position.set(20,40,20);scene.add(sun);const road=new THREE.Mesh(new THREE.PlaneGeometry(40,300),new THREE.MeshStandardMaterial({color:'#202b36',roughness:.9}));road.rotation.x=-Math.PI/2;scene.add(road);
await prepareManufacturerCar('mclaren-p1-gtr',{low:true});const model=createManufacturerCar({assetId:'mclaren-p1-gtr',vehicle:'mclaren-p1-gtr',low:true});scene.add(model.group);const fx=createEffects(scene,{low:true});
function frame(boost,ev=false,reduced=false){fx.clear();const car={x:0,z:0,yaw:0,speed:30,vx:0,vz:30};for(let i=0;i<30;i++){car.z=i*.5;fx.update(car,1/60,i/60,true,{nitro:boost,reducedMotion:reduced,profile:{...model.group.userData.effects,...(ev?{exhausts:[]}: {})}});}model.group.position.z=car.z;camera.position.set(2.3,2.6,car.z-9);camera.lookAt(0,.45,car.z-1);renderer.render(scene,camera);document.querySelector('#status').textContent=`Local rendering fixture · ${boost?'Blue Nitro':'Normal driving'}${ev?' · EV wake':''}${reduced?' · Reduced motion':''}`;}
document.querySelector('#normal').onclick=()=>frame(false);document.querySelector('#boost').onclick=()=>frame(true);document.querySelector('#ev').onclick=()=>frame(true,true);document.querySelector('#reduced').onclick=()=>frame(true,false,true);frame(true);
</script></html>
