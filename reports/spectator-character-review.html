<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original spectator mesh review</title><style>body{margin:0;background:#25323e;color:white;font:14px system-ui}header{position:absolute;left:20px;top:15px;background:#110017dd;padding:14px;border-radius:10px}button{padding:12px;font:inherit;margin-right:6px}</style><header>Original spectator mesh • local renderer fixture, not a gameplay test<p><button id="near">Anatomy</button><button id="far">Track distance</button><button id="pass">Moving pass / LOD</button><button id="pause">Pause</button></p><output id="stats"></output></header><script type="module">
import * as T from 'three';import {createCrowd} from '/src/crowd.js';
const scene=new T.Scene();scene.background=new T.Color('#25323e');const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight('#d7e7ff','#574434',1.8));const sun=new T.DirectionalLight('#ffeddf',2.1);sun.position.set(-5,6,7);scene.add(sun);
const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,250);camera.position.set(0,1.75,6);camera.lookAt(0,1,0);
let seed=433;const rng=()=>((seed=Math.imul(seed,1664525)+1013904223)>>>0)/4294967296;
const crowd=createCrowd();for(let i=0;i<6;i++){crowd.add((i-2.5)*1.15,0,0,0,false,rng,{gesture:i%5});}crowd.render(scene);
const floor=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:'#4b5255',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;scene.add(floor);
let paused=false,carZ=5,movingPass=false;document.querySelector('#near').onclick=()=>{camera.position.set(0,1.75,6);camera.lookAt(0,1,0);carZ=5;movingPass=false};document.querySelector('#far').onclick=()=>{camera.position.set(0,2,45);camera.lookAt(0,1,0);carZ=45;movingPass=false};document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#pass').onclick=()=>movingPass=true;
const clock=new T.Clock();renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();if(movingPass&&!paused){carZ=6+(Math.sin(t*.33)*.5+.5)*42;camera.position.set(0,1.75,carZ);camera.lookAt(0,1,0);}crowd.update(t,{x:0,z:carZ,speed:25},{paused});renderer.render(scene,camera);document.querySelector('#stats').textContent=`${scene.userData.crowd.activeCharacters} original character meshes / ${renderer.info.render.calls} draws / ${renderer.info.render.triangles.toLocaleString()} triangles`;});
</script></html>
