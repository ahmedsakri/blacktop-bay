<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local canister and scenery visual review</title><style>body{margin:0;background:#110017;color:white;font:14px system-ui}canvas{display:block}header{position:absolute;top:10px;left:10px;padding:12px;background:#110017e8;max-width:calc(100% - 44px)}p{margin:6px 0}button{min-height:44px;padding:8px 15px;background:#021439;color:white;border:1px solid #a784d4;font:inherit;margin:4px}button:focus-visible{outline:3px solid #fff71e}#state{font-size:12px;color:#cfbfdf}</style></head><body><header>Actual renderer: Nitro equipment and trackside services<p>Local visual fixture. This is not a completed gameplay test.</p><button id="bottle">Canister detail</button><button id="distance">Driving distance</button><button id="night">Night lighting</button><button id="collect">Collect / reset</button><button id="services">Fan zone</button><button id="marshal">Marshals</button><p id="state">Loading</p></header><script type="module">
import * as T from 'three';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';import{createPickupView}from'/src/race-pickup-view.js';import{createTracksideServices}from'/src/trackside-services.js';import{createCrowd}from'/src/crowd.js';import{getTrack}from'/src/track.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#3b4a59');const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.9;room.dispose();pmrem.dispose();
const fill=new T.HemisphereLight('#d8e9ee','#404037',1.7);scene.add(fill);const sun=new T.DirectionalLight('#fff0d9',2.2);sun.position.set(-3,5,3);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#323a3e',roughness:.78}));floor.rotation.x=-Math.PI/2;floor.position.y=.005;scene.add(floor);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,1500);camera.position.set(2.2,1.7,4);camera.lookAt(0,1.15,0);
const pickups=[{id:'review',x:0,y:0,z:0,tx:0,tz:-1,playerAvailable:true}];const view=createPickupView(scene,pickups);let service=false,seed=37;const rng=()=>((seed=Math.imul(seed,1664525)+1013904223)>>>0)/4294967296;
const crowd=createCrowd(),track=getTrack('harbor'),zone=createTracksideServices(scene,track,{crowd,rng});crowd.render(scene);
const info=document.querySelector('#state');const setInfo=text=>info.textContent=text;
const showBottle=()=>{service=false;zone.visible=false;for(const child of scene.children)if(child.name.startsWith('race-spectators'))child.visible=false;camera.position.set(2.2,1.7,4);camera.lookAt(0,1.15,0);setInfo('Six shared vessel materials. Nine draws for all Nitro pickups.');};showBottle();
document.querySelector('#bottle').onclick=showBottle;
document.querySelector('#distance').onclick=()=>{showBottle();camera.position.set(1.7,2.5,13);camera.lookAt(0,.8,0);setInfo('Canister at 13 metres from the chase camera.');};
let night=false;document.querySelector('#night').onclick=()=>{night=!night;sun.intensity=night?.25:2.2;fill.intensity=night?.45:1.7;scene.environmentIntensity=night?.42:.9;scene.background.set(night?'#101d32':'#3b4a59');setInfo(night?'Night environment; contained cyan charge stays visible.':'Daylight environment.');};
document.querySelector('#collect').onclick=()=>{pickups[0].playerAvailable=!pickups[0].playerAvailable;setInfo(pickups[0].playerAvailable?'Reset available pickup.':'Collected: physical bottle disappears; brief ground wake.');};
function showServices(kind){service=true;zone.visible=true;for(const child of scene.children)if(child.name.startsWith('race-spectators'))child.visible=true;const s=zone.userData.sites.find(s=>s.kind===kind),c=Math.cos(s.yaw),n=Math.sin(s.yaw);camera.position.set(s.x-c*s.side*11+n*4,s.y+3.8,s.z+n*s.side*11+c*4);camera.lookAt(s.x,s.y+1.6,s.z);setInfo(`${kind}: actual service meshes and articulated crowd; five prop batches.`);}
document.querySelector('#services').onclick=()=>showServices('fan-zone');document.querySelector('#marshal').onclick=()=>showServices('marshal');
let previous=0;renderer.setAnimationLoop(time=>{const dt=Math.min(.05,(time-previous)/1000);previous=time;view.update(pickups,time/1000,!service,false,dt);crowd.update(time/1000,{x:camera.position.x,z:camera.position.z,speed:20});renderer.render(scene,camera);});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
