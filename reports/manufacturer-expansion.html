<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blacktop Bay · manufacturer expansion review</title><style>
body{margin:0;background:#110017;color:#fff;font:15px system-ui}header{padding:20px;position:sticky;top:0;background:#110017ed;z-index:1}h1{font-size:20px;margin:0 0 8px}#outputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}figure{margin:0;background:#021439}figcaption{padding:12px}img{display:block;width:100%;height:auto}button{min-height:44px;background:#fff71e;color:#110017;padding:10px 18px;border:0;cursor:pointer}#stage{display:none}#status{margin:8px 0}a{color:#fff71e}@media(max-width:600px){#outputs{grid-template-columns:1fr}}
</style></head><body><header><h1>Manufacturer expansion · actual runtime models</h1><p id="status">Loading model review…</p><button id="next">Next car</button> <a id="gallery" href="?all=1">Render all cars</a></header><div id="stage"></div><main id="outputs"></main><script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {prepareManufacturerCar,createManufacturerCar} from '/src/manufacturer-car.js';
import {MANUFACTURER_VEHICLES} from '/src/manufacturer-vehicles.js';
import {applyPaint} from '/src/paint.js';
const cars=MANUFACTURER_VEHICLES.slice(16),q=new URLSearchParams(location.search),selected=cars.findIndex(c=>c.id===q.get('id')),index=Math.max(0,selected),status=document.querySelector('#status');
document.querySelector('#next').onclick=()=>location.href='?id='+cars[(index+1)%cars.length].id;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(q.has('thumbs')?2000:1000,q.has('thumbs')?1120:560);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#stage').append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#191824');const room=new RoomEnvironment(),pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(room,.04).texture;room.dispose();pmrem.dispose();scene.add(new THREE.HemisphereLight('#edf2ff','#403344',.8));
for(const[x,y,z,intensity]of[[4,7,6,2.8],[-5,3,-5,1.5]]){const l=new THREE.DirectionalLight('#ffffff',intensity);l.position.set(x,y,z);l.castShadow=true;l.shadow.mapSize.set(2048,2048);Object.assign(l.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.5,far:30});l.shadow.normalBias=.015;scene.add(l);}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#292b38',roughness:.67,metalness:.1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.018;floor.receiveShadow=true;scene.add(floor);const camera=new THREE.PerspectiveCamera(33,1000/560,.1,100);
function output(car,view){renderer.render(scene,camera);const fig=document.createElement('figure'),label=document.createElement('figcaption'),img=new Image();label.textContent=car.name+' · '+view;img.alt=label.textContent;img.dataset.id=car.id;img.dataset.view=view;img.src=renderer.domElement.toDataURL('image/webp',.94);fig.append(label,img);document.querySelector('#outputs').append(fig);}
try{for(const car of(q.has('all')?cars:[cars[index]])){for(const low of(q.has('thumbs')?[false]:[false,true])){status.textContent='Preparing '+car.name+' · '+(low?'mobile':'desktop');await prepareManufacturerCar(car.assetId,{low});const m=createManufacturerCar({assetId:car.assetId,vehicle:car.id,low});scene.add(m.group);const length=m.group.userData.dimensions.length,scale=length/4.6;
camera.position.set(5.9*scale,2.8*scale,6.8*scale);camera.lookAt(0,.55,0);if(!q.has('thumbs'))output(car,low?'low-front':'high-front');
if(!low){const background=scene.background;scene.background=null;floor.visible=false;renderer.setClearColor('#000000',0);output(car,'portrait');floor.visible=true;scene.background=background;}
if(!low&&!q.has('thumbs')){camera.position.set(-5.9*scale,2.8*scale,-6.8*scale);camera.lookAt(0,.55,0);output(car,'high-rear');camera.position.set(5.9*scale,2.8*scale,6.8*scale);camera.lookAt(0,.55,0);applyPaint(m,car.id,{color:'blue',finish:'gloss'});m.update({time:0});m.update({time:.04,speed:24,steering:.65,brake:1});output(car,'paint-and-wheels');}m.dispose();await new Promise(requestAnimationFrame);}}
status.textContent='READY · front, rear, body-only paint, articulated wheels and mobile geometry';document.body.dataset.ready='true';}catch(error){status.textContent='FAILED: '+error.message;console.error(error);document.body.dataset.error=error.message;}
</script></body></html>
