<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local manufacturer model review</title>
<style>body{margin:0;background:#110017;color:white;font:15px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#110017;z-index:2;flex-wrap:wrap}button,select,a{min-height:44px;padding:8px 14px;font:inherit}#stage{height:65vh}canvas{display:block;width:100%;height:100%}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}article{border:1px solid #9146ff;padding:12px;background:#181020}img{width:100%;display:block}p{padding:0 18px}a{color:#fff71e}button{cursor:pointer}@media(max-width:600px){#cards{grid-template-columns:1fr}}</style>
<header><label>Car <select id="car"></select></label><label>Detail <select id="detail"><option value="low">Mobile</option><option value="high">Desktop</option></select></label><button id="rotate">Quarter turn</button><button id="paint">Paint / original</button><button id="portraits">Render all portraits</button><button id="wheels">Roll wheels</button><span id="status" role="status">Starting</span></header><div id="stage"></div><p>Local inspection fixture. Uses shipping meshes and runtime. Not included in production.</p><div id="cards"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {MANUFACTURER_VEHICLES} from '/src/manufacturer-vehicles.js';
import {prepareManufacturerCar,createManufacturerCar} from '/src/manufacturer-car.js';
import {applyPaint} from '/src/paint.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),select=document.querySelector('#car'),detail=document.querySelector('#detail');
for(const car of MANUFACTURER_VEHICLES)select.add(new Option(car.name,car.id));
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});stage.append(renderer.domElement);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,60),pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment(),env=pmrem.fromScene(room,.04);scene.environment=env.texture;scene.environmentIntensity=.7;room.dispose();pmrem.dispose();
scene.add(new THREE.HemisphereLight('#e3efff','#454049',.8));const key=new THREE.DirectionalLight('#fff4e4',2);key.position.set(-4,7,4);scene.add(key);const rim=new THREE.DirectionalLight('#c3e3ff',1);rim.position.set(4,3,-5);scene.add(rim);
let model,angle=0,rolling=false,custom=false;
function frame(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.position.set(6*Math.cos(angle),3.2,6*Math.sin(angle));camera.lookAt(0,.65,0);camera.updateProjectionMatrix();renderer.render(scene,camera);}
async function choose(){status.textContent='Loading model';try{await prepareManufacturerCar(select.value,{low:detail.value==='low'});model?.group.removeFromParent();model?.dispose();model=createManufacturerCar({assetId:select.value,vehicle:select.value,low:detail.value==='low'});scene.add(model.group);angle=.9;custom=false;frame();status.textContent=`Ready · ${select.value} · ${renderer.info.render.triangles.toLocaleString()} triangles`;document.body.dataset.ready=select.value;}catch(e){status.textContent=e.message;console.error(e);}}
select.onchange=choose;detail.onchange=choose;document.querySelector('#rotate').onclick=()=>{angle+=Math.PI/2;frame()};document.querySelector('#paint').onclick=()=>{custom=!custom;applyPaint(model,select.value,{color:custom?'red':'factory',finish:'gloss'});frame()};document.querySelector('#wheels').onclick=()=>{rolling=!rolling;};window.addEventListener('resize',frame);
document.querySelector('#portraits').onclick=async()=>{
const cards=document.querySelector('#cards');cards.replaceChildren();
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(800,400);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
const c=new THREE.OrthographicCamera(-4,4,2,-2,.1,40),s=new THREE.Scene();s.environment=env.texture;s.environmentIntensity=.8;s.add(new THREE.HemisphereLight('#e3efff','#454049',1));const l=key.clone();l.intensity=2.3;s.add(l,rim.clone());
try{for(const car of MANUFACTURER_VEHICLES){status.textContent=`Portrait ${car.name}`;await prepareManufacturerCar(car.assetId,{low:true});const m=createManufacturerCar({assetId:car.assetId,vehicle:car.id,low:true});try{s.add(m.group);const b=new THREE.Box3().setFromObject(m.group),center=b.getCenter(new THREE.Vector3());c.position.copy(center).add(new THREE.Vector3(6,3.1,7.6));c.lookAt(center);c.updateMatrixWorld();const p=new THREE.Box3();for(const x of[b.min.x,b.max.x])for(const y of[b.min.y,b.max.y])for(const z of[b.min.z,b.max.z])p.expandByPoint(new THREE.Vector3(x,y,z).applyMatrix4(c.matrixWorldInverse));const half=Math.max((p.max.y-p.min.y)/2,(p.max.x-p.min.x)/4)*1.08;c.left=-half*2;c.right=half*2;c.top=half;c.bottom=-half;c.updateProjectionMatrix();r.render(s,c);const url=r.domElement.toDataURL('image/webp',.94),article=document.createElement('article'),img=new Image();img.src=url;img.dataset.asset=car.assetId;img.alt=car.name;article.append(img);const name=document.createElement('h2');name.textContent=car.name;article.append(name);cards.append(article);}finally{m.group.removeFromParent();m.dispose();}await new Promise(requestAnimationFrame);}status.textContent='All portraits rendered';}catch(e){status.textContent=e.message;console.error(e)}finally{r.dispose();r.forceContextLoss();}};
let time=0,previous=performance.now();function animate(now){const dt=Math.min((now-previous)/1000,.05);previous=now;time+=dt;if(rolling&&model){model.update({speed:12,steering:.4,nitro:false,time});frame();}requestAnimationFrame(animate)}requestAnimationFrame(animate);await choose();
</script></html>
